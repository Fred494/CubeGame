<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta Cubos - Pré-visualização</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="cubes.css">
<link rel="icon" href="favicon.svg">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="app" class="pv">
  <div class="hbar"><span class="brand" style="font-size:18px">CONTA <b>CUBOS</b></span><span class="chip">pré-visualização</span><span class="grow"></span><a href="host.html">Criar jogo →</a></div>
  <div class="pv-grid">
    <div class="card pv-ctl">
      <label class="f" for="level">Nível</label><select id="level"></select>
      <label class="f" for="tpl">Molde</label><select id="tpl"></select>
      <label class="f" for="seed">Semente</label><input id="seed" inputmode="numeric" value="1">
      <div class="ctl" style="margin-top:12px"><button class="btn green sm" id="gen">Gerar</button><button class="btn ghost sm" id="nextSeed">Semente +1</button><button class="btn ghost sm" id="rand">🎲 Aleatória</button></div>
      <div class="ctl" style="margin-top:8px"><button class="btn ghost sm" id="spin">⏸ Parar rotação</button><button class="btn ghost sm" id="build">▶ Construir camadas</button></div>
      <label class="f" style="margin-top:14px">Diagrama manual (JSON)</label>
      <textarea id="manual" rows="3" placeholder="[[3,0,2],[1,4,4],[0,2,1]]"></textarea>
      <button class="btn ghost sm" id="loadManual" style="margin-top:6px">Validar e mostrar</button>
      <div id="info" style="margin-top:14px"></div>
    </div>
    <div class="pv-stage"><div id="stage"></div><div id="formula" class="formula"></div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="row"><h2 style="font-size:18px">Estatísticas de dificuldade</h2><span class="grow"></span><button class="btn ghost sm" id="stats">Gerar 40 por molde</button></div><div id="statsOut" class="muted" style="margin-top:8px">Gera vários diagramas por molde e mostra o intervalo de cubos, as tentativas necessárias e os que falham a validação.</div></div>
</div>
<script src="config.js"></script>
<script type="module" src="preview.js"></script>
</body>
</html>
